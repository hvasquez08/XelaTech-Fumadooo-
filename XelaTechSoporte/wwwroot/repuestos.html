<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repuestos - XelaTech Soporte</title>
    <link rel="icon" href="img/logo.svg">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="repuestos">
    <header id="barra"></header>

    <div class="encabezado">
        <a class="volver" href="index.html">← Volver al panel</a>
        <h1 class="titulo-modulo"><span class="mini"><img src="img/repuestos.svg" alt=""></span> Gestión de repuestos</h1>
    </div>

    <main class="contenido">
        <section class="tarjeta">
            <h2>Registrar repuesto</h2>
            <div class="fila">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre">
                </div>
                <div>
                    <label for="categoria">Categoría</label>
                    <input type="text" id="categoria" placeholder="Memoria, Energía...">
                </div>
                <div>
                    <label for="existencia">Existencia inicial</label>
                    <input type="number" id="existencia" min="0" value="0">
                </div>
                <div>
                    <label for="minima">Existencia mínima</label>
                    <input type="number" id="minima" min="0" value="2">
                </div>
                <div>
                    <label for="costo">Costo unitario (Q)</label>
                    <input type="number" id="costo" min="0" step="0.01">
                </div>
                <div>
                    <label for="precio">Precio de venta (Q)</label>
                    <input type="number" id="precio" min="0" step="0.01">
                </div>
            </div>
            <button class="boton" onclick="registrarRepuesto()">Registrar</button>
            <p class="ayuda">El precio de venta no puede ser menor que el costo.</p>
        </section>

        <section class="tarjeta">
            <h2>Consultar / reabastecer</h2>
            <label for="repuestoElegido">Repuesto</label>
            <select id="repuestoElegido" onchange="mostrarRepuesto()"></select>

            <div id="ficha" class="ficha oculto">
                <dl>
                    <dt>Nombre</dt><dd id="fNombre"></dd>
                    <dt>Categoría</dt><dd id="fCategoria"></dd>
                    <dt>Existencia</dt><dd id="fExistencia"></dd>
                    <dt>Mínimo</dt><dd id="fMinimo"></dd>
                    <dt>Precio de venta</dt><dd id="fPrecio"></dd>
                    <dt>Estado</dt><dd id="fEstado"></dd>
                </dl>
            </div>

            <label for="cantidad">Cantidad a ingresar</label>
            <input type="number" id="cantidad" min="1" value="5">
            <button class="boton" onclick="reabastecer()">Reabastecer</button>
        </section>

        <section class="tarjeta ancha">
            <div class="titulo-con-boton">
                <h2 style="flex:1">Inventario</h2>
                <div class="opciones" id="grupoVista" style="max-width:380px">
                    <button class="activo" data-valor="todos" onclick="elegirOpcion(this); cargarRepuestos()">Todos</button>
                    <button data-valor="minimos" onclick="elegirOpcion(this); cargarRepuestos()">En mínimo o agotados</button>
                </div>
            </div>
            <div id="tablaRepuestos"></div>
        </section>
    </main>

    <script src="js/comun.js"></script>
    <script src="js/repuestos.js"></script>
</body>
</html>
